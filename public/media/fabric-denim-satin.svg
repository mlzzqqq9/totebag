<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDenim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173F38"/>
      <stop offset="100%" stop-color="#0F2420"/>
    </linearGradient>
    <linearGradient id="denimBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D4D6B"/>
      <stop offset="50%" stop-color="#1F364D"/>
      <stop offset="100%" stop-color="#17283A"/>
    </linearGradient>
    <linearGradient id="satinGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C18755"/>
      <stop offset="50%" stop-color="#F2D8B3"/>
      <stop offset="100%" stop-color="#C18755"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgDenim)"/>
  <!-- Bag 1: Denim (Left) -->
  <g transform="translate(140, 40)">
    <path d="M 90 140 C 90 60, 190 60, 190 140" fill="none" stroke="#C18755" stroke-width="12" stroke-linecap="round"/>
    <rect x="40" y="130" width="200" height="230" rx="12" fill="url(#denimBlue)" stroke="#E8B878" stroke-width="2.5" stroke-dasharray="8,4"/>
    <!-- Jeans pocket -->
    <path d="M 80 200 L 160 200 L 145 270 L 95 270 Z" fill="#182C3D" stroke="#E8B878" stroke-width="2"/>
    <text x="140" y="390" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">KAIN DENIM JEANS</text>
  </g>
  <!-- Bag 2: Satin Full Print (Right) -->
  <g transform="translate(460, 40)">
    <path d="M 90 140 C 90 60, 190 60, 190 140" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <rect x="40" y="130" width="200" height="230" rx="12" fill="url(#satinGlow)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Vibrant printing sample -->
    <circle cx="140" cy="235" r="45" fill="#173F38" opacity="0.9"/>
    <polygon points="140,205 152,228 178,232 159,250 163,275 140,263 117,275 121,250 102,232 128,228" fill="#FCE9C8"/>
    <text x="140" y="390" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" text-anchor="middle">SATIN PRINTING HALUS</text>
  </g>
  <text x="400" y="470" fill="#D9A873" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">PILIHAN BAHAN TRENDI: DENIM KASUAL &amp; SATIN PRINTING FULL-COLOR</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMika" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B423A"/>
      <stop offset="100%" stop-color="#0E2824"/>
    </linearGradient>
    <linearGradient id="pvcShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.25)"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgMika)"/>
  <!-- Handle -->
  <path d="M 330 180 C 330 75, 470 75, 470 180" fill="none" stroke="#C18755" stroke-width="16" stroke-linecap="round"/>
  <!-- Inner Content Visible Through Clear PVC -->
  <rect x="290" y="240" width="120" height="150" rx="8" fill="#D9A873" opacity="0.85"/>
  <rect x="420" y="260" width="80" height="130" rx="6" fill="#FFFFFF" opacity="0.75"/>
  <!-- Transparent Mika Bag Body -->
  <rect x="260" y="170" width="280" height="260" rx="14" fill="url(#pvcShine)" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Diagonal Reflection Glare -->
  <polygon points="270,180 340,180 430,420 360,420" fill="#FFFFFF" opacity="0.12"/>
  <!-- Reinforced Gusset & Bottom -->
  <rect x="260" y="405" width="280" height="25" rx="4" fill="#C18755" opacity="0.9"/>
  <!-- Badge Specs -->
  <rect x="580" y="80" width="180" height="65" rx="8" fill="#13352F" stroke="#C18755" stroke-width="1.5"/>
  <text x="670" y="108" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">PVC MIKA TRANSPARAN</text>
  <text x="670" y="130" fill="#D9A873" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Aesthetic • 100% Anti Air</text>
  <!-- Label -->
  <text x="400" y="465" fill="#E8DFC8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">TOTE BAG MIKA BENING TRANSPARAN MODERN</text>
</svg>

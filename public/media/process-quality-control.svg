      <stop offset="0%" stop-color="#1B473E"/>
      <stop offset="100%" stop-color="#102B25"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgQc)"/>
  <!-- Inspection Board Visual -->

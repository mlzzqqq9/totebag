  <text x="400" y="420" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">QUALITY CONTROL MENYELURUH 100% SEBELUM KIRIM</text>
  <text x="400" y="445" fill="#D9A873" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Pengecekan dimensi, ketepatan posisi logo, kebersihan sisa benang, dan uji kekuatan jahit</text>

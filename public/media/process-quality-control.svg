      <text x="50" y="47" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" text-anchor="middle">QC PASSED</text>
      <text x="50" y="63" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ZERO DEFECT</text>

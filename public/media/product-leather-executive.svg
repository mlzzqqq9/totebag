<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F3EE"/>
      <stop offset="100%" stop-color="#E7DDD0"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="100%" stop-color="#5C3A1E"/>
    </linearGradient>
    <filter id="shadowLt" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3D2512" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgLt)" rx="16"/>
  <ellipse cx="300" cy="385" rx="145" ry="16" fill="#3D2512" opacity="0.14"/>

  <!-- Leather Handles with Metal Rivets -->
  <g filter="url(#shadowLt)">
    <path d="M225 210 C225 90, 375 90, 375 210" fill="none" stroke="#4A2E16" stroke-width="12" stroke-linecap="round"/>
    <path d="M225 210 C225 90, 375 90, 375 210" fill="none" stroke="#7A4B22" stroke-width="8" stroke-linecap="round"/>
    <!-- Metal Rivets -->
    <circle cx="225" cy="210" r="5" fill="#D4AF37"/>
    <circle cx="375" cy="210" r="5" fill="#D4AF37"/>
  </g>

  <!-- Bag Body Executive Horizontal PU Leather -->
  <g filter="url(#shadowLt)">
    <path d="M185 200 L415 200 L400 375 C398 382 390 388 380 388 L220 388 C210 388 202 382 200 375 Z" fill="url(#leatherGrad)"/>
  </g>

  <!-- Luxury Stitch Details -->
  <path d="M195 208 L405 208 L392 370 L208 370 Z" fill="none" stroke="#C18755" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Subtle Debossed Corporate Logo Mockup -->
  <g transform="translate(250, 245)">
    <rect x="15" y="15" width="70" height="45" rx="4" fill="#4A2E16" opacity="0.5"/>
    <circle cx="50" cy="37" r="14" fill="none" stroke="#3D2512" stroke-width="2"/>
    <text x="50" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#3D2512" text-anchor="middle" letter-spacing="2">EXECUTIVE VIP</text>
    <text x="50" y="100" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#7A4B22" text-anchor="middle">PU LEATHER</text>
  </g>
</svg>

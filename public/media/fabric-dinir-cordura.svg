<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173F38"/>
      <stop offset="100%" stop-color="#0E2824"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A5C52"/>
      <stop offset="100%" stop-color="#1B423A"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9A873"/>
      <stop offset="100%" stop-color="#B37840"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  <!-- Decorative Grid -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
  </g>
  <!-- Handles -->
  <path d="M 320 180 C 320 80, 480 80, 480 180" fill="none" stroke="url(#goldGrad)" stroke-width="18" stroke-linecap="round"/>
  <!-- Bag Body Cordura / Dinir D600 -->
  <rect x="250" y="170" width="300" height="260" rx="16" fill="url(#bagGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Front Zipper Pocket -->
  <rect x="280" y="270" width="240" height="130" rx="10" fill="#15362F" stroke="#377265" stroke-width="2"/>
  <line x1="295" y1="290" x2="505" y2="290" stroke="#C18755" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Water Repellent Drop Badge -->
  <circle cx="400" cy="225" r="32" fill="#173F38" stroke="#C18755" stroke-width="2"/>
  <path d="M 400 205 C 388 220, 385 230, 385 235 A 15 15 0 0 0 415 235 C 415 230, 412 220, 400 205 Z" fill="#D9A873"/>
  <!-- Badge Specs -->
  <rect x="580" y="80" width="180" height="65" rx="8" fill="#13352F" stroke="#C18755" stroke-width="1.5"/>
  <text x="670" y="108" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" text-anchor="middle">DINIR D600 &amp; CORDURA</text>
  <text x="670" y="130" fill="#D9A873" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle">Tahan Air • Ekstra Tangguh</text>
  <!-- Text Label -->
  <text x="400" y="465" fill="#E8DFC8" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="1">MATERIAL CORDURA &amp; POLIESTER DINIR TAHAN AIR</text>
</svg>

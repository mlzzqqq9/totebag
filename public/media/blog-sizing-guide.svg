<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlog2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2825"/>
      <stop offset="100%" stop-color="#121D1A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBlog2)" rx="16"/>
  <!-- Bag Dimension Diagrams -->
  <g transform="translate(140, 80)">
    <!-- Flat 30x40 -->
    <rect x="0" y="30" width="180" height="230" rx="8" fill="none" stroke="#C18755" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="90" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">30 × 40 cm</text>
    <text x="90" y="155" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#C18755" text-anchor="middle">Flat Standard A4</text>
    <!-- dimension lines -->
    <line x1="0" y1="20" x2="180" y2="20" stroke="#C18755" stroke-width="2"/>
    <text x="90" y="14" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#C18755" text-anchor="middle">30 cm</text>

    <!-- Gusset 35x40x10 -->
    <g transform="translate(280, 0)">
      <polygon points="30,30 210,30 180,260 0,260" fill="none" stroke="#25D366" stroke-width="2.5"/>
      <line x1="30" y1="30" x2="30" y2="260" stroke="#25D366" stroke-width="1.5" stroke-dasharray="4 3"/>
      <text x="110" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">35 × 40 × 10 cm</text>
      <text x="110" y="155" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#25D366" text-anchor="middle">With 10cm Gusset</text>
    </g>
  </g>
  <text x="400" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Standar Ukuran Tote Bag Seminar yang Ideal</text>
  <text x="400" y="405" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#DFE3DE" text-anchor="middle">Dimensi Proporsional untuk Stopmap Folio, Tumbler, dan Laptop</text>
</svg>

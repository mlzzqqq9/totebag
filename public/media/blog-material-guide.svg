<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlog1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173F38"/>
      <stop offset="100%" stop-color="#0E2E29"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBlog1)" rx="16"/>
  <!-- 3 Swatches of Fabric -->
  <g transform="translate(100, 80)">
    <!-- Swatch 1: Canvas -->
    <g transform="translate(0, 0)">
      <rect width="170" height="230" rx="12" fill="#23584F" stroke="#C18755" stroke-width="2"/>
      <rect x="20" y="20" width="130" height="110" rx="8" fill="#173F38"/>
      <text x="85" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#C18755" text-anchor="middle">12 oz</text>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">CANVAS</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Kuat &amp; Premium</text>
    </g>

    <!-- Swatch 2: Blacu -->
    <g transform="translate(210, 0)">
      <rect width="170" height="230" rx="12" fill="#FBF9F4" stroke="#DFE3DE" stroke-width="2"/>
      <rect x="20" y="20" width="130" height="110" rx="8" fill="#ECE5D6"/>
      <text x="85" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#173F38" text-anchor="middle">ECO</text>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#173F38" text-anchor="middle">BLACU</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#626D68" text-anchor="middle">Alami &amp; Vintage</text>
    </g>

    <!-- Swatch 3: Spunbond -->
    <g transform="translate(420, 0)">
      <rect width="170" height="230" rx="12" fill="#25485E" stroke="#486581" stroke-width="2"/>
      <rect x="20" y="20" width="130" height="110" rx="8" fill="#1B3A4B"/>
      <text x="85" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">75G</text>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">SPUNBOND</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Hemat &amp; Ringan</text>
    </g>
  </g>
  <text x="400" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Panduan Memilih Bahan Tote Bag Custom B2B</text>
  <text x="400" y="405" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#C18755" text-anchor="middle">Perbandingan Karakteristik, Gramasi, dan Anggaran Pengadaan</text>
</svg>

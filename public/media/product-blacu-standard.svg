<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlacu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#ECE5D6"/>
    </linearGradient>
    <filter id="shadowBl" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3A3226" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgBlacu)" rx="16"/>
  <ellipse cx="300" cy="385" rx="140" ry="14" fill="#3A3226" opacity="0.10"/>

  <!-- Handles -->
  <g filter="url(#shadowBl)">
    <path d="M225 210 C225 95, 375 95, 375 210" fill="none" stroke="#D4CCBA" stroke-width="12" stroke-linecap="round"/>
    <path d="M225 210 C225 95, 375 95, 375 210" fill="none" stroke="#F5EFE0" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bag Body Standard 30x40 Flat -->
  <g filter="url(#shadowBl)">
    <path d="M195 195 L405 195 L395 380 C393 388 385 390 375 390 L225 390 C215 390 207 388 205 380 Z" fill="#F8F3E6" stroke="#DED6C4" stroke-width="2"/>
  </g>

  <line x1="205" y1="205" x2="395" y2="205" stroke="#B8AE9C" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- Seminar Logo Screenprint in Pine Green -->
  <g transform="translate(250, 245)">
    <rect x="15" y="10" width="70" height="45" rx="6" fill="#173F38"/>
    <circle cx="50" cy="32" r="14" fill="#C18755"/>
    <text x="50" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#173F38" text-anchor="middle" letter-spacing="1.5">BLACU SUPER</text>
    <text x="50" y="95" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#626D68" text-anchor="middle">GRADE A SEMINAR</text>
  </g>
</svg>

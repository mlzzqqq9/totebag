<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPrint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143630"/>
      <stop offset="100%" stop-color="#0B1F1B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgPrint)"/>
  <!-- Screen Printing Frame -->
  <g transform="translate(160, 60)">
    <!-- Wooden / Aluminum Screen Frame -->
    <rect x="30" y="40" width="420" height="280" rx="8" fill="#1C453C" stroke="#C18755" stroke-width="12"/>
    <!-- Mesh Area -->
    <rect x="50" y="60" width="380" height="240" fill="#295E53" opacity="0.8"/>
    <!-- Printed Logo Design Shape -->
    <circle cx="240" cy="180" r="60" fill="#D9A873" opacity="0.95"/>
    <polygon points="240,140 256,170 290,175 265,198 271,232 240,215 209,232 215,198 190,175 224,170" fill="#173F38"/>
    <!-- Squeegee (Rakel) with Rubber Blade -->
    <rect x="100" y="100" width="280" height="28" rx="6" fill="#C18755" stroke="#E5BE94" stroke-width="2"/>
    <rect x="110" y="128" width="260" height="10" fill="#333333"/>
  </g>
  <text x="400" y="415" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">PRESISI CETAK LOGO: SABLON RUBBER &amp; DTF DIGITAL</text>
  <text x="400" y="440" fill="#D9A873" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Warna tajam, gradasi presisi, dan daya rekat tinta teruji tahan cuci berulang kali</text>
</svg>

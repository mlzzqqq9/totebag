<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPort2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EDE9"/>
      <stop offset="100%" stop-color="#C8DDD5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgPort2)" rx="16"/>
  <!-- Modern onboarding kit tote bag in pine green with notebook and pen -->
  <g transform="translate(100, 60)">
    <!-- Bag -->
    <rect x="70" y="90" width="220" height="260" rx="10" fill="#173F38"/>
    <!-- Handle -->
    <path d="M120 90 C120 20, 240 20, 240 90" fill="none" stroke="#0E2E29" stroke-width="14"/>
    <path d="M120 90 C120 20, 240 20, 240 90" fill="none" stroke="#173F38" stroke-width="10"/>

    <!-- Notebook sticking out of bag -->
    <rect x="210" y="60" width="110" height="150" rx="6" fill="#C18755" transform="rotate(12 210 60)"/>
    <rect x="220" y="80" width="85" height="10" rx="3" fill="#FFFFFF" opacity="0.8" transform="rotate(12 210 60)"/>

    <!-- Bag logo & text -->
    <circle cx="180" cy="180" r="26" fill="none" stroke="#C18755" stroke-width="2.5"/>
    <text x="180" y="235" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">STARTUP TECH KIT</text>
    <text x="180" y="255" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#C18755" text-anchor="middle">180 PCS SURABAYA</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShipping" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#163C34"/>
      <stop offset="100%" stop-color="#0E231F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgShipping)"/>
  <!-- Shipping Cargo Visual -->
  <g transform="translate(180, 80)">
    <!-- Cargo Box 1 -->
    <rect x="50" y="80" width="220" height="180" rx="8" fill="#C18755" stroke="#E2B184" stroke-width="3"/>
    <!-- Tape -->
    <rect x="50" y="155" width="220" height="30" fill="#99602E"/>
    <rect x="145" y="80" width="30" height="180" fill="#99602E"/>
    <!-- Shipping Label -->
    <rect x="75" y="100" width="60" height="45" rx="3" fill="#FFFFFF"/>
    <line x1="82" y1="110" x2="125" y2="110" stroke="#333333" stroke-width="2"/>
    <line x1="82" y1="120" x2="115" y2="120" stroke="#333333" stroke-width="2"/>
    <line x1="82" y1="130" x2="128" y2="130" stroke="#333333" stroke-width="2"/>
    <!-- Cargo Truck Icon Badge -->
    <circle cx="340" cy="140" r="45" fill="#173F38" stroke="#C18755" stroke-width="3"/>
    <path d="M 315 130 L 345 130 L 358 145 L 358 155 L 315 155 Z" fill="#D9A873"/>
    <circle cx="325" cy="158" r="6" fill="#FFFFFF"/>
    <circle cx="350" cy="158" r="6" fill="#FFFFFF"/>
    <!-- Plastic Individual Wrap Stack -->
    <rect x="230" y="170" width="160" height="90" rx="6" fill="#2E695D" stroke="#FFFFFF" stroke-width="2" opacity="0.9"/>
    <text x="310" y="215" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">INDIVIDUAL WRAP</text>
    <text x="310" y="232" fill="#D9A873" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Plastik Seal Per Tas</text>
  </g>
  <text x="400" y="415" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" text-anchor="middle">PENGEMASAN AMAN &amp; DISTRIBUSI KARGO ANTARKOTA</text>
  <text x="400" y="440" fill="#D9A873" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle">Dikemas plastik satuan, karung dobel terpal anti basah, dan dikirim via ekspedisi kargo terpercaya</text>
</svg>

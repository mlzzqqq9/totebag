<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPort1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAE5D9"/>
      <stop offset="100%" stop-color="#DAD3C3"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgPort1)" rx="16"/>
  <!-- Stacks of tote bags representing mass production run -->
  <g transform="translate(60, 40)">
    <!-- Bag 3 behind -->
    <rect x="220" y="80" width="180" height="240" rx="8" fill="#F0EBE0" stroke="#C4BCAB" stroke-width="2"/>
    <!-- Bag 2 mid -->
    <rect x="180" y="110" width="180" height="240" rx="8" fill="#F5F0E6" stroke="#C4BCAB" stroke-width="2"/>
    <!-- Bag 1 front -->
    <g transform="translate(140, 140)">
      <rect x="0" y="0" width="180" height="240" rx="8" fill="#FAF7F0" stroke="#C4BCAB" stroke-width="2"/>
      <!-- Handle -->
      <path d="M45 0 C45 -60, 135 -60, 135 0" fill="none" stroke="#D4CCBA" stroke-width="10"/>
      <!-- Conference print -->
      <rect x="35" y="45" width="110" height="55" rx="6" fill="#173F38"/>
      <circle cx="90" cy="72" r="14" fill="#C18755"/>
      <text x="90" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#173F38" text-anchor="middle">SEMINAR NASIONAL</text>
      <text x="90" y="148" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#626D68" text-anchor="middle">TEKNOLOGI 2026</text>
      <text x="90" y="180" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#C18755" text-anchor="middle">BATCH: 350 PCS</text>
    </g>
  </g>
  <!-- QC Verified Badge -->
  <g transform="translate(430, 60)">
    <circle cx="45" cy="45" r="42" fill="#173F38"/>
    <circle cx="45" cy="45" r="38" fill="none" stroke="#C18755" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="45" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">QC PASSED</text>
    <text x="45" y="58" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#C18755" text-anchor="middle">MALANG</text>
  </g>
</svg>

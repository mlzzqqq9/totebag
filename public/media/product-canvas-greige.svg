<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGreige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EEE5"/>
      <stop offset="100%" stop-color="#E2DDD2"/>
    </linearGradient>
    <filter id="shadowGr" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#3A3226" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bgGreige)" rx="16"/>
  <ellipse cx="300" cy="385" rx="135" ry="15" fill="#3A3226" opacity="0.12"/>

  <!-- Handles Natural Cotton Webbing -->
  <g filter="url(#shadowGr)">
    <path d="M225 210 C225 90, 375 90, 375 210" fill="none" stroke="#D1C7B7" stroke-width="12" stroke-linecap="round"/>
    <path d="M225 210 C225 90, 375 90, 375 210" fill="none" stroke="#E5DEC9" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Bag Body Natural Raw Canvas -->
  <g filter="url(#shadowGr)">
    <path d="M195 195 L405 195 L392 380 C390 388 382 392 372 392 L228 392 C218 392 210 388 208 380 Z" fill="#EFE8D8" stroke="#DCD3C0" stroke-width="2"/>
  </g>

  <!-- Double Top Stitches -->
  <line x1="205" y1="205" x2="395" y2="205" stroke="#A89F8D" stroke-width="1.8" stroke-dasharray="4 3"/>
  <line x1="207" y1="210" x2="393" y2="210" stroke="#A89F8D" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Natural Cotton Specks Effect -->
  <circle cx="230" cy="240" r="1.5" fill="#B0A694"/>
  <circle cx="340" cy="270" r="1.2" fill="#B0A694"/>
  <circle cx="280" cy="350" r="1.5" fill="#B0A694"/>
  <circle cx="360" cy="330" r="1.2" fill="#B0A694"/>

  <!-- Custom Graphic Stamp -->
  <g transform="translate(250, 245)">
    <circle cx="50" cy="40" r="32" fill="none" stroke="#173F38" stroke-width="3"/>
    <path d="M50 18 L50 62 M28 40 L72 40" stroke="#173F38" stroke-width="2.5"/>
    <text x="50" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#173F38" text-anchor="middle" letter-spacing="2">ORGANIC GREIGE</text>
    <text x="50" y="105" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#626D68" text-anchor="middle">10 OZ NATURAL</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBlog3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#173F38"/>
      <stop offset="100%" stop-color="#1B2A27"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgBlog3)" rx="16"/>
  <!-- 3 Techniques Icons -->
  <g transform="translate(100, 80)">
    <!-- Sablon Manual -->
    <g transform="translate(0, 0)">
      <rect width="170" height="230" rx="12" fill="#23584F" stroke="#C18755" stroke-width="2"/>
      <circle cx="85" cy="75" r="35" fill="#173F38"/>
      <rect x="65" y="65" width="40" height="20" rx="4" fill="#C18755"/>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">SABLON MANUAL</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Rubber &amp; Plastisol</text>
    </g>

    <!-- DTF Digital -->
    <g transform="translate(210, 0)">
      <rect width="170" height="230" rx="12" fill="#23584F" stroke="#C18755" stroke-width="2"/>
      <circle cx="85" cy="75" r="35" fill="#173F38"/>
      <circle cx="75" cy="70" r="12" fill="#25D366"/>
      <circle cx="95" cy="70" r="12" fill="#C18755"/>
      <circle cx="85" cy="85" r="12" fill="#1D6EBC"/>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">DIGITAL DTF</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Full Color Gradasi</text>
    </g>

    <!-- Bordir Komputer -->
    <g transform="translate(420, 0)">
      <rect width="170" height="230" rx="12" fill="#23584F" stroke="#C18755" stroke-width="2"/>
      <circle cx="85" cy="75" r="35" fill="#173F38"/>
      <path d="M65 65 L105 85 M65 85 L105 65" stroke="#C18755" stroke-width="3" stroke-linecap="round"/>
      <text x="85" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">BORDIR KOMPUTER</text>
      <text x="85" y="190" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Eksklusif &amp; Bertekstur</text>
    </g>
  </g>
  <text x="400" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">Sablon Manual, DTF, atau Bordir: Mana Teknik Terbaik?</text>
  <text x="400" y="405" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#C18755" text-anchor="middle">Perbandingan Ketahanan Warna, Biaya, dan Karakteristik Kain</text>
</svg>
